<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" role="img" aria-label="A translucent window over a desktop wallpaper, with an opacity button and slider">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#241a33"/>
      <stop offset="0.45" stop-color="#55305f"/>
      <stop offset="1" stop-color="#e2a7bd"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.46"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="blur" x="-10%" y="-10%" width="120%" height="130%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="640" height="300" fill="url(#wall)"/>
  <circle cx="520" cy="60" r="70" fill="#ffd9e6" opacity="0.55" filter="url(#soft)"/>
  <circle cx="120" cy="250" r="90" fill="#3a2a55" opacity="0.5" filter="url(#soft)"/>

  <!-- window -->
  <g filter="url(#blur)">
    <rect x="64" y="42" width="512" height="228" rx="18" fill="#a98fb8" opacity="0.35"/>
  </g>
  <rect x="64" y="42" width="512" height="228" rx="18" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.55"/>
  <rect x="64" y="42" width="132" height="228" rx="18" fill="url(#side)"/>
  <rect x="182" y="42" width="14" height="228" fill="#ffffff" opacity="0.1"/>

  <!-- sidebar rows -->
  <rect x="82" y="66" width="96" height="12" rx="6" fill="#ffffff" opacity="0.55"/>
  <rect x="82" y="96" width="96" height="26" rx="9" fill="#ffffff" opacity="0.5"/>
  <rect x="82" y="140" width="70" height="9" rx="4.5" fill="#2c2140" opacity="0.3"/>
  <rect x="82" y="160" width="88" height="9" rx="4.5" fill="#2c2140" opacity="0.22"/>
  <rect x="82" y="180" width="60" height="9" rx="4.5" fill="#2c2140" opacity="0.22"/>
  <rect x="82" y="228" width="88" height="20" rx="10" fill="#ffffff" opacity="0.34"/>

  <!-- content -->
  <rect x="210" y="66" width="150" height="11" rx="5.5" fill="#2c2140" opacity="0.5"/>
  <rect x="210" y="92" width="300" height="9" rx="4.5" fill="#2c2140" opacity="0.26"/>
  <rect x="210" y="110" width="272" height="9" rx="4.5" fill="#2c2140" opacity="0.26"/>
  <rect x="210" y="144" width="326" height="52" rx="12" fill="#ffffff" opacity="0.34"/>
  <rect x="226" y="160" width="220" height="8" rx="4" fill="#2c2140" opacity="0.22"/>
  <rect x="226" y="176" width="180" height="8" rx="4" fill="#2c2140" opacity="0.16"/>
  <rect x="210" y="216" width="326" height="38" rx="12" fill="#ffffff" opacity="0.4"/>
  <rect x="226" y="231" width="150" height="9" rx="4.5" fill="#2c2140" opacity="0.2"/>

  <!-- opacity control -->
  <circle cx="592" cy="156" r="16" fill="#ffffff" fill-opacity="0.82" stroke="#7b879c" stroke-opacity="0.55"/>
  <path d="M592 145a11 11 0 0 1 0 22z" fill="#4f7cff"/>
  <circle cx="592" cy="156" r="11" fill="none" stroke="#4f7cff" stroke-width="2.4" stroke-opacity="0.85"/>

  <g>
    <rect x="452" y="120" width="118" height="78" rx="12" fill="#fdfdff" fill-opacity="0.97" stroke="#7b879c" stroke-opacity="0.3"/>
    <rect x="466" y="136" width="58" height="7" rx="3.5" fill="#3a4252" opacity="0.72"/>
    <rect x="466" y="156" width="90" height="5" rx="2.5" fill="#9aa3b4"/>
    <rect x="466" y="170" width="90" height="5" rx="2.5" fill="#9aa3b4" opacity="0.6"/>
    <rect x="466" y="184" width="66" height="4" rx="2" fill="#4f7cff"/>
    <circle cx="532" cy="186" r="5.5" fill="#4f7cff"/>
  </g>
</svg>
